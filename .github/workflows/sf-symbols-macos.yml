name: Test official SF Symbols on macOS

on:
  push:
    branches:
      - sf-symbols-macos-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sf-symbols:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show macOS version
        run: |
          sw_vers
          uname -m

      - name: Download official SF Symbols DMG from Apple
        run: |
          curl --fail --location --retry 3 \
            "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg?2=" \
            --output "$RUNNER_TEMP/SF-Symbols-27.dmg"
          ls -lh "$RUNNER_TEMP/SF-Symbols-27.dmg"

      - name: Mount DMG and install SF Symbols package
        shell: bash
        run: |
          set -euo pipefail

          MOUNT_POINT="$(hdiutil attach "$RUNNER_TEMP/SF-Symbols-27.dmg" -nobrowse | sed -n 's|^.*\(/Volumes/.*\)$|\1|p' | tail -n 1)"

          if [ -z "$MOUNT_POINT" ]; then
            echo "Could not determine DMG mount point."
            exit 1
          fi

          echo "Mounted at: $MOUNT_POINT"
          find "$MOUNT_POINT" -maxdepth 2 -print

          PKG_PATH="$(find "$MOUNT_POINT" -maxdepth 2 -type f -name "*.pkg" -print -quit)"

          if [ -z "$PKG_PATH" ]; then
            echo "No PKG installer was found in the DMG."
            exit 1
          fi

          echo "Installing package: $PKG_PATH"
          sudo installer -pkg "$PKG_PATH" -target /

          hdiutil detach "$MOUNT_POINT"

          if [ ! -d "/Applications/SF Symbols.app" ]; then
            echo "Installer completed, but /Applications/SF Symbols.app was not found."
            find /Applications -maxdepth 2 -type d -iname "*Symbols*.app" -print
            exit 1
          fi

      - name: Verify Apple app signature and version
        run: |
          codesign --verify --deep --strict --verbose=2 "/Applications/SF Symbols.app"
          echo "SF Symbols version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "/Applications/SF Symbols.app/Contents/Info.plist" || true
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "/Applications/SF Symbols.app/Contents/Info.plist" || true

      - name: Launch the official SF Symbols app
        run: |
          open "/Applications/SF Symbols.app"
          sleep 8
          osascript -e 'tell application "SF Symbols" to activate' || true
          sleep 4

          echo "Running process:"
          pgrep -fl "SF Symbols" || true

          echo "Frontmost application:"
          osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true' || true

      - name: Dismiss welcome screen and inspect official export menu
        run: |
          mkdir -p "$GITHUB_WORKSPACE/official-export"
          osascript <<'APPLESCRIPT'
          tell application "SF Symbols" to activate
          delay 2
          tell application "System Events"
            tell process "SF Symbols"
              set frontmost to true
              try
                click button "Continue" of window 1
              on error
                key code 36
              end try
              delay 3
              try
                set menuNames to name of every menu item of menu 1 of menu bar item "File" of menu bar 1
                log "FILE_MENU: " & (menuNames as text)
              on error errMsg
                log "MENU_INSPECTION_ERROR: " & errMsg
              end try
            end tell
          end tell
          APPLESCRIPT
          screencapture -x "$GITHUB_WORKSPACE/official-export/after-welcome.png" || true

      - name: Test exporting one official folder SVG
        run: |
          osascript <<'APPLESCRIPT'
          tell application "SF Symbols" to activate
          delay 2
          tell application "System Events"
            tell process "SF Symbols"
              set frontmost to true
              keystroke "f" using command down
              delay 1
              keystroke "folder"
              delay 3
              key code 53
              delay 1
              try
                log "WINDOW: " & (name of window 1)
                log "FILE_MENU: " & ((name of every menu item of menu 1 of menu bar item "File" of menu bar 1) as text)
              end try
              try
                click menu item "Export Symbol…" of menu 1 of menu bar item "File" of menu bar 1
              on error errMsg
                log "EXPORT_MENU_ERROR: " & errMsg
                try
                  click menu item "Export Symbol..." of menu 1 of menu bar item "File" of menu bar 1
                end try
              end try
              delay 3
              log "EXPORT_DIALOG: " & (name of window 1)
              keystroke "g" using {command down, shift down}
              delay 1
              keystroke (system attribute "GITHUB_WORKSPACE") & "/official-export"
              key code 36
              delay 2
              key code 36
              delay 5
            end tell
          end tell
          APPLESCRIPT
          echo "Official export files:"
          find "$GITHUB_WORKSPACE/official-export" -maxdepth 2 -type f -print
          find "$GITHUB_WORKSPACE/official-export" -maxdepth 1 -iname '*.svg' | grep -q . || {
            echo "EXPORT_NOT_VERIFIED: no SVG created by the official app"
            exit 1
          }

      - name: Capture the macOS desktop
        run: |
          screencapture -x "$GITHUB_WORKSPACE/sf-symbols-running.png" || true
          ls -lh "$GITHUB_WORKSPACE/sf-symbols-running.png" || true

      - name: Upload proof and official export
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-macos-proof
          path: |
            sf-symbols-running.png
            official-export/
          if-no-files-found: warn
