name: Fresh official SF Symbols 27 export investigation

on:
  push:
    branches: [sf-symbols-macos-test]
    paths:
      - ".github/workflows/sf-symbols-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and install official SF Symbols 27
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg?2=" -o "$RUNNER_TEMP/SF-Symbols-27.dmg"
          hdiutil attach "$RUNNER_TEMP/SF-Symbols-27.dmg" -mountpoint "$RUNNER_TEMP/sf-volume" -nobrowse
          PKG="$(find "$RUNNER_TEMP/sf-volume" -name '*.pkg' -print -quit)"
          test -n "$PKG"
          sudo installer -pkg "$PKG" -target /
          hdiutil detach "$RUNNER_TEMP/sf-volume"
          codesign --verify --deep --strict "/Applications/SF Symbols.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "/Applications/SF Symbols.app/Contents/Info.plist"
      - name: Investigate official command line exporter and category resources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p fresh-export
          APP="/Applications/SF Symbols.app/Contents"
          echo '=== CLI CANDIDATES ==='
          find "$APP" -type f \( -perm -111 -o -name '*symbol*' -o -name '*Symbol*' \) | head -100
          echo '=== CATEGORY METADATA CANDIDATES ==='
          find "$APP" -type f \( -iname '*categor*' -o -iname '*metadata*' -o -iname '*symbol*map*' \) | head -100
          echo '=== APP EXECUTABLE ==='
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          echo '=== CLI HELP CANDIDATES ==='
          for cli in "$APP/MacOS/symbols" "$APP/Resources/symbols" "$APP/Helpers/symbols" "$APP/MacOS/SF Symbols"; do
            if [ -x "$cli" ]; then
              echo "CANDIDATE: $cli"
              "$cli" --help 2>&1 | head -65 || true
            fi
          done
          echo '=== RESOURCE DIRECTORY ==='
          ls -lah "$APP/Resources" | head -100
          echo '=== CATEGORY STRINGS ==='
          find "$APP/Resources" -maxdepth 3 -type f \( -name '*.json' -o -name '*.plist' \) | head -80
      - name: Launch app and inspect export UI
        shell: bash
        run: |
          open "/Applications/SF Symbols.app"
          sleep 8
          osascript <<'APPLESCRIPT' || true
          tell application "System Events"
            tell process "SF Symbols"
              set frontmost to true
              try
                click button "Continue" of window 1
              end try
              delay 2
              log "FILE ITEMS: " & ((name of every menu item of menu 1 of menu bar item "File" of menu bar 1) as text)
              log "WINDOW COUNT: " & (count of windows)
              try
                log "WINDOW CONTENT: " & (entire contents of window 1 as text)
              end try
            end tell
          end tell
          APPLESCRIPT
          screencapture -x fresh-export/app.png || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-fresh-investigation
          path: fresh-export/
          if-no-files-found: warn
