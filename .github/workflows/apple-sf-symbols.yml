name: Apple SF Symbols Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Build exporter
        working-directory: apple-exporter
        run: swift build -c release

      - name: Run exporter
        working-directory: apple-exporter
        run: .build/release/SFExporter

      - name: Upload exported result
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbol-export
          path: apple-exporter/output/
