name: Apple SF Symbols Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show checked out commit
        run: |
          git log -1 --oneline
          printf 'Package.swift first bytes: '
          xxd -l 8 apple-exporter/Package.swift || true
          head -n 1 apple-exporter/Package.swift

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Build exporter
        working-directory: apple-exporter
        run: swift build -c release

      - name: Run exporter
        working-directory: apple-exporter
        run: .build/release/SFExporter

      - name: Verify captured frames are not identical
        working-directory: apple-exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          import sys

          folder = Path("output/bounce")
          frames = sorted(folder.glob("frame-*.png"))
          manifest = json.loads((folder / "manifest.json").read_text())
          hashes = [sha256(frame.read_bytes()).hexdigest() for frame in frames]
          unique = len(set(hashes))
          print(f"Frames: {len(frames)}; unique PNG hashes: {unique}")
          print(f"Manifest frames: {manifest['frames']}; effect: {manifest['effect']}")
          if len(frames) != manifest["frames"] or unique < 6 or manifest.get("uniquePixelFrames", 0) < 6:
              print("CAPTURE_INVALID: no demonstrable animation in exported PNG frames", file=sys.stderr)
              sys.exit(1)
          print("CAPTURE_CHANGED: at least six distinct pixel frames; visual fidelity still requires inspection")
          PY

      - name: Create animation preview
        working-directory: apple-exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import html
          folder = Path("output/bounce")
          data = json.loads((folder / "manifest.json").read_text())
          files = sorted(p.name for p in folder.glob("frame-*.png"))
          page = """<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Apple runtime capture preview</title><style>body{font:16px system-ui;text-align:center;padding:24px;background:#f5f5f7;color:#1d1d1f}
          img{display:block;margin:24px auto;width:256px;height:256px;background:white;border-radius:20px}
          button{padding:10px 18px;border:0;border-radius:24px;cursor:pointer}</style>
          <h1>Captura do runtime Apple</h1><p>Prévia dos PNGs exportados, sem animação CSS sintetizada.</p>
          <img id="frame" alt="Frame capturado"><p id="status"></p><button id="toggle">Pausar</button>
          <script>const frames=FILES;let index=0,playing=true;const img=document.getElementById('frame'),status=document.getElementById('status');
          function tick(){if(!playing)return;img.src=frames[index];status.textContent=(index+1)+' / '+frames.length;index=(index+1)%frames.length}
          document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'Pausar':'Reproduzir'};
          tick();setInterval(tick,1000/FPS);</script></html>"""
          page = page.replace("FILES", json.dumps(files)).replace("FPS", str(data["fps"]))
          (folder / "preview.html").write_text(page, encoding="utf-8")
          print("Preview created: output/bounce/preview.html")
          PY

      - name: Upload exported result
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbol-official-bounce-frames
          path: apple-exporter/output/
          if-no-files-found: error
