name: Apple SF Symbols Export

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show checked out commit
        run: |
          git log -1 --oneline
          printf 'Package.swift first bytes: '
          xxd -l 8 apple-exporter/Package.swift || true
          head -n 1 apple-exporter/Package.swift

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Build exporter
        working-directory: apple-exporter
        run: swift build -c release

      - name: Run exporter
        working-directory: apple-exporter
        run: .build/release/SFExporter

      - name: Verify captured frames are not identical
        working-directory: apple-exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          import sys

          root = Path("output")
          manifests = sorted(root.glob("*/*/manifest.json"))
          if not manifests:
              print("CAPTURE_INVALID: no manifests exported", file=sys.stderr)
              sys.exit(1)

          valid = 0
          for manifest_path in manifests:
              folder = manifest_path.parent
              frames = sorted(folder.glob("frame-*.png"))
              manifest = json.loads(manifest_path.read_text())
              hashes = [sha256(frame.read_bytes()).hexdigest() for frame in frames]
              unique = len(set(hashes))
              print(f"{manifest['symbol']}: frames={len(frames)} unique={unique}")
              if len(frames) == manifest["frames"] and unique >= 6 and manifest.get("uniquePixelFrames", 0) >= 6:
                  valid += 1

          if valid == 0:
              print("CAPTURE_INVALID: no valid animated symbols exported", file=sys.stderr)
              sys.exit(1)
          print(f"CAPTURE_CHANGED: {valid} valid symbol captures")
          PY

      - name: Create animation preview
        working-directory: apple-exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import html
          root = Path("output")
          cards = []
          for manifest_path in sorted(root.glob("*/manifest.json")):
              folder = manifest_path.parent
              data = json.loads(manifest_path.read_text())
              files = sorted(p.name for p in folder.glob("frame-*.png"))
              cards.append({"symbol": data["symbol"], "fps": data["fps"], "folder": folder.name, "frames": files})
          page = """<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Apple runtime capture preview</title><style>body{font:16px system-ui;padding:24px;background:#f5f5f7;color:#1d1d1f}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{background:white;padding:18px;border-radius:20px;text-align:center}
          img{width:220px;height:220px;object-fit:contain}button{padding:9px 16px;border:0;border-radius:22px;cursor:pointer}</style>
          <h1>Capturas do runtime Apple</h1><div class="grid" id="grid"></div>
          <script>const items=ITEMS;const grid=document.getElementById('grid');for(const item of items){let i=0,playing=true;const card=document.createElement('div');card.className='card';
          const h=document.createElement('h2');h.textContent=item.symbol;const img=document.createElement('img');const b=document.createElement('button');b.textContent='Pausar';
          card.append(h,img,b);grid.append(card);const tick=()=>{if(!playing)return;img.src=item.folder+'/'+item.frames[i];i=(i+1)%item.frames.length};tick();setInterval(tick,1000/item.fps);
          b.onclick=()=>{playing=!playing;b.textContent=playing?'Pausar':'Reproduzir'}};</script></html>"""
          page = page.replace("ITEMS", json.dumps(cards))
          (root / "preview.html").write_text(page, encoding="utf-8")
          print(f"Preview created for {len(cards)} captures")
          PY

      - name: Bundle validated captures into site
        working-directory: apple-exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, zipfile

          source = Path("output")
          target = Path("../assets/captures")
          target.mkdir(parents=True, exist_ok=True)

          # Replace only the generated multi-symbol pack, keeping unrelated assets intact.
          valid_symbols = []
          for manifest_path in sorted(source.glob("*/*/manifest.json")):
              folder = manifest_path.parent
              manifest = json.loads(manifest_path.read_text())
              frames = sorted(folder.glob("frame-*.png"))
              if (
                  manifest.get("source") == "Apple Symbols.framework"
                  and manifest.get("effect") in {"bounce", "pulse", "breathe"}
                  and manifest.get("uniquePixelFrames", 0) >= 6
                  and len(frames) == manifest.get("frames")
              ):
                  name = manifest["symbol"]
                  effect = manifest["effect"]
                  valid_symbols.append({"symbol": name, "effect": effect})
                  destination = target / effect / name
                  if destination.exists():
                      shutil.rmtree(destination)
                  shutil.copytree(folder, destination)

                  downloads = target / effect / "downloads"
                  downloads.mkdir(exist_ok=True)
                  zip_path = downloads / f"{name}-{effect}.zip"
                  with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
                      archive.write(destination / "manifest.json", "manifest.json")
                      for frame in sorted(destination.glob("frame-*.png")):
                          archive.write(frame, frame.name)

          for effect in ("bounce", "pulse", "breathe"):
              symbols = [x["symbol"] for x in valid_symbols if x["effect"] == effect]
              effect_dir = target / effect
              effect_dir.mkdir(parents=True, exist_ok=True)
              (effect_dir / "index.json").write_text(
                  json.dumps({"effect": effect, "symbols": symbols}, indent=2),
                  encoding="utf-8"
              )
          print(f"Bundled {len(valid_symbols)} validated captures into the site")
          PY

      - name: Commit bundled captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/captures
          if git diff --cached --quiet; then
            echo "No capture changes to commit"
          else
            git commit -m "Bundle verified Apple animation capture packs"
            git push origin HEAD:main
          fi

      - name: Upload exported result
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbol-official-animation-packs
          path: apple-exporter/output/
          if-no-files-found: error
